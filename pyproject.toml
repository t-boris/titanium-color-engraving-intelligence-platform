[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titanium-color-engraving-platform"
version = "0.34.0"
description = "Local closed-loop platform that learns laser parameter to titanium color relations and produces LightBurn engraving plans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "opencv-contrib-python-headless>=4.9",
  "rawpy>=0.21",
  "openai>=2.16,<4",
  "mcp>=1.12,<2",
  "fonttools>=4.67",
  "uharfbuzz>=0.57",
  "shapely>=2.2",
  "certifi>=2024.2.2",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "httpx>=0.27", "build>=1.0"]
desktop = ["pyinstaller>=6.11"]          # the core packaged for the desktop shell (packaging/sidecar.spec)

[project.scripts]
titanium-platform = "titanium_platform.cli:main"
titanium-research-mcp = "titanium_platform.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
titanium_platform = ["ui/*", "ui/screens/*", "models/*", "schemas/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
