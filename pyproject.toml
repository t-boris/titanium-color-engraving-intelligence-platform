[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titanium-color-engraving-platform"
version = "0.1.0"
description = "Local closed-loop platform that learns laser parameter to titanium color relations and produces LightBurn engraving plans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "opencv-contrib-python-headless>=4.9",
  "rawpy>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1.0"]

[project.scripts]
titanium-platform = "titanium_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
titanium_platform = ["ui/*", "ui/screens/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
