name: CI

# By hand only. The tests are run on the developer's machine before a release (python -m pytest -n 12 -q) and that is the gate.
# This workflow is a deliberate, paid-for check: Actions tab > CI > Run workflow, or `gh workflow run CI`.
# Until 2026-11-07 it started on EVERY pull request and on EVERY push to main (documentation-only pushes too) and ran three jobs
# (ubuntu 3.11, ubuntu 3.12, macOS 3.12) of 29, 46 and 59 minutes each, the suite one test after another: about 11 runs in one day.
on:
  workflow_dispatch:

concurrency:                   # a second manual run of the same ref replaces the first one instead of running beside it
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest     # one job: no macOS (it is billed at ten times the minutes) and no second Python version
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # the UI syntax and translation-coverage tests run the UI scripts with node
      - name: Install tesseract   # optional OCR of the matrix reader; its tests must run, not skip
        shell: bash
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
          tesseract --version
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests (none may be skipped)
        shell: bash   # explicit bash runs with -eo pipefail, so a failing pytest is not hidden by tee
        run: |
          python -m pytest -q -rs -n auto | tee pytest.log      # in parallel on every core of the runner (pytest-xdist is in the dev extras)
          if grep -qE "[0-9]+ skipped" pytest.log; then echo "::error::tests were skipped"; exit 1; fi
      - name: Build wheel
        run: python -m build --wheel
      - name: Installed wheel serves its version and UI
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl httpx   # httpx only for the test client below
          /tmp/wheel-env/bin/python - <<'PY'
          from fastapi.testclient import TestClient
          from titanium_platform import __version__
          from titanium_platform.api.app import create_app
          import tempfile
          with TestClient(create_app(tempfile.mkdtemp()), base_url="http://127.0.0.1") as c:
              assert c.get("/api/version").json()["version"] == __version__ != "0.0.0+source"
              home = c.get("/")
              assert home.status_code == 200 and "Laser workshop" in home.text
              for path in ("/styles.css", "/app.js", "/screens/ingest.js"):
                  assert c.get(path).status_code == 200, path
          print("wheel OK", __version__)
          PY
