# The Windows x64 desktop build (feature electron, DEC-036, DEC-044): by hand only. It packages the Python core with PyInstaller, runs
# the core's smoke check on the runner, runs the shell's tests and makes the unsigned Squirrel installer, kept as a workflow artifact.
# Publishing it as a GitHub pre-release (DEC-048) is a separate, manual step.
name: desktop

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or tag to build"
        required: false
        default: "main"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the core with PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[desktop]"
      - name: Build the core
        working-directory: packaging
        run: pyinstaller --noconfirm --distpath ../dist --workpath ../build/pyinstaller sidecar.spec
      - name: Smoke-test the built core
        run: dist\titanium-core\titanium-core.exe --smoke
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Shell tests
        working-directory: desktop
        run: |
          npm ci
          npm test
      - name: Make the installer (unsigned)
        working-directory: desktop
        run: npm run make -- --platform win32 --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: TitaniumWorkshop-windows-x64-unsigned
          path: desktop/out/make/**/*
          if-no-files-found: error
